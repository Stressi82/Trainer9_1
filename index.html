<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b49">
  <meta name="description" content="Verkäufertrainer mit 920 Multiple-Choice-Fragen und einer durchgehenden Lernreise in 23 Etappen.">
  <meta name="application-name" content="Verkäufertrainer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Verkäufertrainer">
  <meta name="format-detection" content="telephone=no">
  <title>Verkäufertrainer v1.1 · Verkäufer-Lernreise</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=1.1.0">
</head>
<body>
  <noscript>Diese App benötigt JavaScript. Bitte JavaScript im Browser aktivieren.</noscript>
  <div id="app" aria-live="polite">
    <div class="boot-screen">
      <div class="boot-logo">V</div>
      <strong>Verkäufertrainer wird gestartet …</strong>
      <span>Lernplattform wird geladen</span>
    </div>
  </div>
  <script src="./data.js?v=1.1.0"></script>
  <script src="./app.js?v=1.1.0"></script>
  <script>
    window.setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.querySelector('.boot-screen')) {
        app.innerHTML = '<main class="startup-error"><h1>Die App konnte nicht gestartet werden.</h1><p>Bitte die Seite neu laden. Falls der Fehler bleibt, den Browser-Cache löschen und die Seite erneut öffnen.</p><button onclick="location.reload()">Neu laden</button></main>';
      }
    }, 8000);
  </script>
</body>
</html>
